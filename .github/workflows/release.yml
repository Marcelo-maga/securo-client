  # =========================================================================
  # 4. CONSOLIDATE & PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Consolidate & Publish GitHub Release
    needs: [windows, android]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.windows.result == 'success' || needs.android.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: securo-*
          path: release-artifacts
          merge-multiple: true

      - name: Consolidate SHA-256 checksums across all release assets
        shell: bash
        run: |
          cd release-artifacts
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|\./||' > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          echo "=== Consolidated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Publish Consolidated GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || github.event_name == 'workflow_dispatch' }}
