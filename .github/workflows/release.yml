name: Release Securo Native Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "windows"
          - "android"
      build_type:
        description: "Build type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"
      android_arch:
        description: "Android target architecture (when building Android)"
        required: false
        default: "aarch64"
        type: choice
        options:
          - "aarch64"
          - "armv7"
          - "x86_64"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SECURO_REPOSITORY: securo-finance/securo
  SECURO_FRONTEND_PATH: frontend
  NODE_VERSION: "22"
  # Rust CI performance optimizations
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Gradle CI performance optimizations
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false -Dorg.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC"

jobs:
  # =========================================================================
  # 1. WINDOWS DESKTOP BUILD (Native NSIS Setup EXE & WiX MSI Installers)
  # =========================================================================
  windows:
    name: Windows Desktop (x64)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target and Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cache Securo frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~\AppData\Local\npm-cache
          key: npm-frontend-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-frontend-${{ runner.os }}-

      - name: Prepare and build Securo frontend
        run: npm run frontend:prepare

      - name: Stage frontend for Tauri
        run: npm run frontend:stage

      - name: Generate application icons
        run: npm run icons:generate

      - name: Build Windows Desktop (NSIS & MSI)
        shell: pwsh
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          $BuildType = if ($env:INPUT_BUILD_TYPE) { $env:INPUT_BUILD_TYPE } else { "release" }
          if ($BuildType -eq "debug") {
            Write-Host "::notice ::Building Windows desktop application in debug mode..."
            npm run tauri -- build --debug
          } else {
            Write-Host "::notice ::Building Windows desktop application in release mode (NSIS + MSI)..."
            npm run tauri -- build
          }

      - name: Package Windows artifacts and calculate SHA-256 checksums
        run: npm run artifacts:package

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securo-desktop-windows
          path: artifacts/*
          retention-days: 14

  # =========================================================================
  # 2. ANDROID MOBILE BUILD (APK)
  # =========================================================================
  android:
    name: Android APK (${{ inputs.android_arch || 'aarch64' }})
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout native client
        uses: actions/checkout@v4

      - name: Resolve target architecture
        id: target-map
        shell: bash
        run: |
          ARCH="${{ inputs.android_arch || 'aarch64' }}"
          case "$ARCH" in
            armv7)
              echo "rust_target=armv7-linux-androideabi" >> $GITHUB_OUTPUT
              echo "tauri_target=armv7" >> $GITHUB_OUTPUT
              ;;
            x86_64)
              echo "rust_target=x86_64-linux-android" >> $GITHUB_OUTPUT
              echo "tauri_target=x86_64" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "rust_target=aarch64-linux-android" >> $GITHUB_OUTPUT
              echo "tauri_target=aarch64" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target-map.outputs.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cache Securo frontend dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-frontend-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-frontend-${{ runner.os }}-

      - name: Prepare and build Securo frontend
        run: npm run frontend:prepare

      - name: Stage frontend for Tauri
        run: npm run frontend:stage

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Generate and configure application icons
        run: npm run icons:generate

      - name: Configure Android permissions and insets
        run: npm run android:configure

      - name: Build Android APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_TARGET: ${{ steps.target-map.outputs.tauri_target }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-release}"
          if [[ "${BUILD_TYPE}" == "release" && -n "${KEYSTORE_BASE64}" ]]; then
            echo "::notice ::Building release APK and signing with configured keystore..."
            KEYSTORE_FILE="/tmp/release.keystore"
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}"

            npm run tauri -- android build --target "${TAURI_TARGET}" --apk

            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -n 1)
            if [[ -n "${UNSIGNED_APK}" ]]; then
              SIGNED_APK="${UNSIGNED_APK/-unsigned.apk/.apk}"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
                --ks "${KEYSTORE_FILE}" \
                --ks-pass "pass:${KEYSTORE_PASSWORD}" \
                --ks-key-alias "${KEY_ALIAS}" \
                --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
                --out "${SIGNED_APK}" \
                "${UNSIGNED_APK}"
              rm -f "${UNSIGNED_APK}"
              echo "Signed release APK created at: ${SIGNED_APK}"
            fi
            rm -f "${KEYSTORE_FILE}"
          else
            if [[ "${BUILD_TYPE}" == "release" ]]; then
              echo "::warning ::Release mode was selected, but ANDROID_KEYSTORE_BASE64 secret is not configured. Falling back to debug APK."
            fi
            echo "::notice ::Building debug APK (automatically signed with Android debug keystore for installation and testing)."
            npm run tauri -- android build --target "${TAURI_TARGET}" --debug --apk
          fi

      - name: Package artifacts and calculate SHA-256 checksums
        run: npm run artifacts:package

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securo-android-${{ steps.target-map.outputs.tauri_target }}
          path: artifacts/*
          retention-days: 14

  # =========================================================================
  # 3. FUTURE DESKTOP PLATFORMS (macOS & Linux - Pre-configured architecture)
