name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "windows"
          - "android"
      build_type:
        description: "Build type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"
      android_arch:
        description: "Android target architecture (when building Android)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "aarch64"
          - "armv7"
          - "x86_64"
      securo_ref:
        description: "Optional upstream Securo git tag or commit SHA to pin"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SECURO_REPOSITORY: securo-finance/securo
  SECURO_REF: ${{ inputs.securo_ref || '' }}
  SECURO_FRONTEND_PATH: frontend
  NODE_VERSION: "22"
  # Rust CI performance optimizations
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Gradle CI performance optimizations
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false -Dorg.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC"

jobs:
  # =========================================================================
  # 0. PREPARE & STAGE FRONTEND ONCE (Shared across all Desktop & Mobile jobs)
  # =========================================================================
  prepare-frontend:
    name: Prepare & Stage Frontend Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native client
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client dependencies
        run: npm ci

      - name: Cache upstream Securo npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-upstream-frontend-${{ runner.os }}-${{ env.SECURO_REF || 'head' }}
          restore-keys: |
            npm-upstream-frontend-${{ runner.os }}-

      - name: Clone, adapt, and build upstream Securo frontend
        run: npm run frontend:prepare

      - name: Bundle HTTP bridge and stage frontend dist
        run: npm run frontend:stage

      - name: Upload staged frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: staged-frontend
          path: dist/
          include-hidden-files: true
          retention-days: 1

  # =========================================================================
  # 1. WINDOWS DESKTOP BUILD (Native NSIS Setup EXE & WiX MSI Installers)
  # =========================================================================
  windows:
    name: Windows Desktop (x64)
    needs: [prepare-frontend]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client CLI dependencies
        run: npm ci

      - name: Download pre-staged frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: staged-frontend
          path: dist

      - name: Verify staged frontend integrity
        run: node -e "import('./scripts/stage-frontend.mjs').then(m => { if (!m.hasValidStagedDist()) throw new Error('Staged frontend bundle incomplete or failed CSP check'); })"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target and Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-x64

      - name: Build Windows Desktop (NSIS & MSI)
        shell: pwsh
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          $BuildType = if ($env:INPUT_BUILD_TYPE) { $env:INPUT_BUILD_TYPE } else { "release" }
          if ($BuildType -eq "debug") {
            Write-Host "::notice ::Building Windows desktop application in debug mode..."
            npm run tauri -- build --debug
          } else {
            Write-Host "::notice ::Building Windows desktop application in release mode (NSIS + MSI)..."
            npm run tauri -- build
          }

      - name: Package Windows artifacts and calculate SHA-256 checksums
        run: npm run artifacts:package

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: securo-desktop-windows
          path: artifacts/*
          retention-days: 14

  # =========================================================================
  # 2. ANDROID MOBILE BUILD (APK Matrix: arm64-v8a, armeabi-v7a, x86_64)
  # =========================================================================
  android:
    name: Android APK (${{ matrix.arch }})
    needs: [prepare-frontend]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'push' || inputs.android_arch == 'all' || inputs.android_arch == '') && fromJSON('["aarch64", "armv7", "x86_64"]') || fromJSON(format('["{0}"]', inputs.android_arch)) }}
    steps:
      - name: Checkout native client
        uses: actions/checkout@v7

      - name: Resolve target architecture
        id: target-map
        shell: bash
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          case "$MATRIX_ARCH" in
            armv7)
              echo "rust_target=armv7-linux-androideabi" >> "$GITHUB_OUTPUT"
              echo "tauri_target=armv7" >> "$GITHUB_OUTPUT"
              ;;
            x86_64)
              echo "rust_target=x86_64-linux-android" >> "$GITHUB_OUTPUT"
              echo "tauri_target=x86_64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "rust_target=aarch64-linux-android" >> "$GITHUB_OUTPUT"
              echo "tauri_target=aarch64" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client CLI dependencies
        run: npm ci

      - name: Download pre-staged frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: staged-frontend
          path: dist

      - name: Verify staged frontend integrity
        run: node -e "import('./scripts/stage-frontend.mjs').then(m => { if (!m.hasValidStagedDist()) throw new Error('Staged frontend bundle incomplete or failed CSP check'); })"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target-map.outputs.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android-${{ matrix.arch }}

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Configure Android permissions, icons, and insets
        run: npm run android:configure

      - name: Build Android APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_TARGET: ${{ steps.target-map.outputs.tauri_target }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          BUILD_TYPE="${INPUT_BUILD_TYPE:-release}"
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            if [[ -z "${KEYSTORE_BASE64}" ]]; then
              echo "::error ::Release mode requires ANDROID_KEYSTORE_BASE64 secret. Refusing to fall back to a debug-signed APK."
              exit 1
            fi
            echo "::notice ::Building release APK and signing with configured keystore..."
            KEYSTORE_FILE="${RUNNER_TEMP}/release.keystore"
            trap 'rm -f "${KEYSTORE_FILE}"' EXIT
            (umask 077 && echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}")

            npm run tauri -- android build --target "${TAURI_TARGET}" --apk

            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -n 1)
            if [[ -z "${UNSIGNED_APK}" ]]; then
              echo "::error ::Expected unsigned release APK was not produced."
              exit 1
            fi
            SIGNED_APK="${UNSIGNED_APK/-unsigned.apk/.apk}"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "${KEYSTORE_FILE}" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "${SIGNED_APK}" \
              "${UNSIGNED_APK}"
            rm -f "${UNSIGNED_APK}"
            echo "Signed release APK created at: ${SIGNED_APK}"
          else
            echo "::notice ::Building debug APK (explicitly requested via build_type=debug)."
            npm run tauri -- android build --target "${TAURI_TARGET}" --debug --apk
          fi

      - name: Package artifacts and calculate SHA-256 checksums
        env:
          TAURI_TARGET: ${{ steps.target-map.outputs.tauri_target }}
        run: npm run artifacts:package

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: securo-android-${{ steps.target-map.outputs.tauri_target }}
          path: artifacts/*
          retention-days: 14

  # =========================================================================
  # 3. FUTURE DESKTOP PLATFORMS (macOS & Linux - Pre-configured architecture)
  # To activate in the future:
  # - Uncomment jobs, extend `inputs.platform`, and add to `publish-release.needs`
  # - Both consume `staged-frontend` directly without re-cloning or rebuilding UI
