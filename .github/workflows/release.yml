name: Release Securo Native Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SECURO_REPOSITORY: securo-finance/securo
  SECURO_FRONTEND_PATH: frontend
  NODE_VERSION: "22"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout native client
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native client dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Fetch Securo frontend
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${SECURO_REPOSITORY}.git" .securo-frontend-repository
          git -C .securo-frontend-repository sparse-checkout set "${SECURO_FRONTEND_PATH}"
          mv ".securo-frontend-repository/${SECURO_FRONTEND_PATH}" .securo-frontend
          rm -rf .securo-frontend-repository

      - name: Cache Node, Rust, and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pnpm
            ~/.yarn/berry
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-deps-${{ hashFiles('src-tauri/Cargo.lock', '.securo-frontend/package-lock.json', '.securo-frontend/yarn.lock', '.securo-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            android-deps-

      - name: Install and build Securo frontend
        shell: bash
        working-directory: .securo-frontend
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          else
            npm install
          fi
          npm run build

      - name: Stage frontend for Tauri
        shell: bash
        run: |
          test -d .securo-frontend/dist
          mkdir -p .securo-config
          cp src/setup.html .securo-config/config.html
          cp -R src/scripts src/styles src/locales .securo-config/
          rm -rf src
          cp -R .securo-frontend/dist src
          mv src/index.html src/app.html
          mkdir -p src/config
          cp .securo-config/config.html src/config/config.html
          cp -R .securo-config/scripts .securo-config/styles .securo-config/locales src/config/
          sed -i 's#styles/setup.css#config/styles/setup.css#; s#scripts/setup.js#config/scripts/setup.js#' src/config/config.html
          cp src-tauri/bridge/bootstrap.html src/index.html
          cp src-tauri/bridge/mobile-overrides.css src/mobile-overrides.css
          npx esbuild src-tauri/bridge/http-bridge.js --bundle --format=iife --platform=browser --outfile=src/securo-http-bridge.js
          node -e "const fs=require('fs'); const file='src/app.html'; const html=fs.readFileSync(file,'utf8'); const injected=html.replace(/<\\/head>/i, '<link rel=\"stylesheet\" href=\"/mobile-overrides.css\"><script src=\"/securo-http-bridge.js\"></script></head>'); fs.writeFileSync(file, injected);"

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Build Android APK
        run: npm run tauri -- android build --target aarch64 --debug --apk

      - name: Publish Android APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || github.event_name == 'workflow_dispatch' }}
