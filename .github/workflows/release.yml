  #         retention-days: 14
  #
  # linux:
  #   name: Linux Desktop (DEB & AppImage)
  #   needs: [prepare-frontend]
  #   if: false # Activated when Linux releases are officially scheduled
  #   runs-on: ubuntu-22.04
  #   steps:
  #     - uses: actions/checkout@v7
