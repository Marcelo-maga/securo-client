name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint-and-scripts:
    name: Lint & Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate scripts syntax
        run: |
          node --check scripts/prepare-frontend.mjs
          node --check scripts/stage-frontend.mjs
          node --check scripts/configure-android.mjs
          node --check scripts/generate-icons.mjs
          node --check scripts/package-artifacts.mjs

      - name: Verify HTTP Bridge bundling
        run: npx esbuild src-tauri/bridge/http-bridge.js --bundle --format=iife --platform=browser --outfile=/tmp/bridge-test.js

      - name: Run JavaScript & Frontend Test Suite
        run: npm test

  rust-tests:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
