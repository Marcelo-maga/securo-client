name: Check Upstream Securo Release

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: check-upstream-release
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check Latest Official Securo Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native client repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Query latest official release from securo-finance/securo
        id: upstream
        run: |
          echo "Querying GitHub API for latest official release of securo-finance/securo..."
          RELEASE_JSON=$(curl -sSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "User-Agent: SecuroClient-Upstream-Watcher" \
            https://api.github.com/repos/securo-finance/securo/releases/latest)

          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.draft // false')
          IS_PRERELEASE=$(echo "$RELEASE_JSON" | jq -r '.prerelease // false')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::warning ::Could not fetch latest release tag from upstream (may be empty or rate-limited)."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "Latest upstream release '$LATEST_TAG' is a draft or prerelease; ignoring."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found latest published upstream release: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          CURRENT_VERSION=""
          if [ -f .upstream-version ]; then
            CURRENT_VERSION=$(tr -d '[:space:]' < .upstream-version)
          fi
          echo "Current pinned version: '$CURRENT_VERSION'"

          if [ "$LATEST_TAG" != "$CURRENT_VERSION" ]; then
            echo "New upstream release detected: $LATEST_TAG (current pinned: $CURRENT_VERSION)"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "securo-client is already up-to-date with upstream release $CURRENT_VERSION. No action needed."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin new upstream release and commit to main
        if: steps.upstream.outputs.should_update == 'true'
        run: |
          NEW_TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "$NEW_TAG" > .upstream-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .upstream-version
          git commit -m "feat(upstream): update frontend to securo $NEW_TAG"
          git push origin main
          echo "Pushed new upstream pin $NEW_TAG to main branch."
