<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Securo</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --text: #0f172a;
        --primary: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --text: #f8fafc;
          --primary: #3b82f6;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        gap: 1rem;
      }
      .brand-mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border-radius: 0.85rem;
        background: linear-gradient(135deg, var(--primary), #1d4ed8);
        color: #fff;
        font-size: 1.35rem;
        font-weight: 900;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
      }
      .spinner {
        width: 1.5rem;
        height: 1.5rem;
        animation: spin 0.8s linear infinite;
        color: var(--primary);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="brand-mark">S</div>
    <svg class="spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle opacity=".25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
      <path opacity=".9" fill="currentColor" d="M21 12a9 9 0 0 1-9 9v-3a6 6 0 0 0 6-6h3Z" />
    </svg>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      const openConfig = () => window.location.replace("config/config.html");
      if (!invoke) {
        openConfig();
      } else {
        invoke("get_connection_settings")
          .then((settings) => {
            const serverUrl = settings?.server_url || settings?.serverUrl;
            window.location.replace(serverUrl ? "app.html#/" : "config/config.html");
          })
          .catch(openConfig);
      }
    </script>
  </body>
</html>
