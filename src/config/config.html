<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Securo</title>
    <link rel="stylesheet" href="styles/setup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="brand-mark">
          <svg width="26" height="26" viewBox="0 0 460 460" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="Securo">
            <g transform="translate(0,460) scale(0.1,-0.1)" fill="#ffffff" stroke="none">
              <path d="M2125 4149 c-222 -23 -430 -97 -652 -232 -66 -40 -103 -68 -103 -79 0 -9 19 -59 41 -110 197 -446 465 -1250 614 -1845 61 -242 56 -233 -140 252 -299 743 -439 1057 -601 1355 -132 242 -116 226 -200 210 -95 -18 -242 -94 -335 -173 -91 -78 -219 -246 -219 -287 0 -11 364 -501 695 -935 75 -99 202 -265 281 -370 79 -104 200 -264 269 -355 69 -90 125 -168 125 -172 0 -10 -239 236 -405 417 -70 77 -172 187 -225 245 -102 111 -597 675 -764 870 -54 63 -101 116 -106 118 -19 7 -147 -149 -188 -231 -69 -137 -83 -193 -89 -352 -5 -137 -5 -143 24 -227 69 -198 189 -332 419 -462 128 -74 473 -256 889 -470 94 -49 289 -150 435 -226 336 -175 381 -189 500 -154 29 8 193 89 364 178 171 90 435 227 586 306 607 316 773 409 857 481 118 101 213 247 249 379 25 94 23 270 -5 375 -33 126 -102 255 -178 336 l-66 70 -30 -28 c-38 -36 -176 -191 -477 -538 -283 -326 -309 -355 -576 -649 -251 -276 -410 -443 -418 -435 -5 5 65 102 260 354 158 206 589 774 936 1235 l176 235 -30 57 c-97 182 -323 356 -529 405 l-71 17 -19 -23 c-33 -41 -190 -338 -282 -535 -121 -259 -232 -522 -433 -1025 -93 -233 -170 -417 -172 -408 -4 18 107 434 219 827 89 308 250 766 403 1143 31 76 56 142 56 148 0 13 -149 108 -245 156 -262 131 -547 182 -840 152z" />
              <path d="M949 1318 c-28 -94 -31 -206 -6 -270 53 -136 217 -187 567 -174 239 8 470 29 457 42 -7 7 -985 474 -993 474 -2 0 -13 -33 -25 -72z" />
              <path d="M3280 1227 c-185 -89 -406 -196 -492 -237 -106 -50 -151 -77 -140 -81 85 -30 681 -46 782 -20 160 40 232 126 233 277 0 67 -29 225 -42 223 -3 0 -157 -73 -341 -162z" />
            </g>
          </svg>
        </div>
        <h1 data-i18n="title">Configuração do Servidor</h1>
        <p class="subtitle" data-i18n="subtitle">Informe o endereço da API do Securo.</p>
      </header>

      <form id="server-form" novalidate>
        <div class="field">
          <label for="server-url" data-i18n="urlLabel">Endereço do servidor</label>
          <input
            id="server-url"
            name="server-url"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://meu-securo.com"
            required
            class="input"
          />
        </div>

        <div class="options-group">
          <label for="allow-invalid-certs" class="checkbox-row">
            <input id="allow-invalid-certs" type="checkbox" />
            <span data-i18n="certLabel">Permitir certificado autoassinado</span>
          </label>

          <label for="auto-connect" class="checkbox-row">
            <input id="auto-connect" type="checkbox" />
            <span data-i18n="autoConnectLabel">Entrar automaticamente ao abrir o app</span>
          </label>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div id="error-container" class="error-container hidden">
          <div class="error-header">
            <span class="error-title" data-i18n="errorDetailsTitle">Detalhes do erro</span>
            <button id="copy-error-button" type="button" class="btn-copy" data-i18n="copy">Copiar</button>
          </div>
          <pre id="error-details" class="error-details"></pre>
        </div>

        <button id="connect-configured-button" type="button" class="btn btn-primary hidden">
          <span id="connect-configured-label" data-i18n="connectConfigured">Conectar com a URL configurada</span>
          <svg id="loading-configured-icon" class="spinner hidden" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle opacity=".25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
            <path opacity=".9" fill="currentColor" d="M21 12a9 9 0 0 1-9 9v-3a6 6 0 0 0 6-6h3Z" />
          </svg>
        </button>

        <button id="connect-button" type="submit" class="btn btn-primary">
          <span id="connect-label" data-i18n="connect">Conectar</span>
          <svg id="loading-icon" class="spinner hidden" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle opacity=".25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
            <path opacity=".9" fill="currentColor" d="M21 12a9 9 0 0 1-9 9v-3a6 6 0 0 0 6-6h3Z" />
          </svg>
        </button>

        <button id="force-connect-button" class="btn btn-secondary hidden" type="button">
          <span id="force-connect-label" data-i18n="forceConnect">Continuar mesmo assim</span>
        </button>

        <button id="clear-button" class="btn btn-secondary hidden" type="button" data-i18n="useAnother">
          Trocar servidor
        </button>
      </form>
    </main>
    <script type="module" src="scripts/setup.js"></script>
  </body>
</html>
