<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Securo</title>
    <link rel="stylesheet" href="styles/setup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="brand-mark">S</div>
        <h1 data-i18n="title">Configuração do Servidor</h1>
        <p class="subtitle" data-i18n="subtitle">Informe o endereço da API do Securo.</p>
      </header>

      <form id="server-form" novalidate>
        <div class="field">
          <label for="server-url" data-i18n="urlLabel">Endereço do servidor</label>
          <input
            id="server-url"
            name="server-url"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://meu-securo.com"
            required
            class="input"
          />
        </div>

        <label for="allow-invalid-certs" class="checkbox-row">
          <input id="allow-invalid-certs" type="checkbox" />
          <span data-i18n="certLabel">Permitir certificado autoassinado</span>
        </label>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <button id="connect-button" type="submit" class="btn btn-primary">
          <span id="connect-label" data-i18n="connect">Conectar</span>
          <svg id="loading-icon" class="spinner hidden" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle opacity=".25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" />
            <path opacity=".9" fill="currentColor" d="M21 12a9 9 0 0 1-9 9v-3a6 6 0 0 0 6-6h3Z" />
          </svg>
        </button>

        <button id="force-connect-button" class="btn btn-secondary hidden" type="button">
          <span id="force-connect-label" data-i18n="forceConnect">Continuar mesmo assim</span>
        </button>

        <button id="clear-button" class="btn btn-danger hidden" type="button" data-i18n="useAnother">
          Trocar servidor
        </button>
      </form>
    </main>
    <script type="module" src="scripts/setup.js"></script>
  </body>
</html>
