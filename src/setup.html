<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Securo</title>
    <link rel="stylesheet" href="styles/setup.css" />
  </head>
  <body>
    <main class="page">
      <div class="layout">
        <section class="intro" aria-labelledby="page-title">
          <div class="brand"><span class="brand-mark">S</span><span data-i18n="brand"></span></div>
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 id="page-title"><span data-i18n="titleLineOne"></span><br /><span class="accent" data-i18n="titleLineTwo"></span></h1>
          <p class="description" data-i18n="description"></p>
          <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 5 6v5c0 4.7 2.9 8.6 7 10 4.1-1.4 7-5.3 7-10V6l-7-3Z" /><path d="m9 12 2 2 4-4" /></svg>
            <span data-i18n="securityNote"></span>
          </div>
        </section>
        <section class="panel" aria-labelledby="setup-title">
          <div class="panel-header"><div><p class="step" data-i18n="step"></p><h2 id="setup-title" data-i18n="heading"></h2></div><span class="private" data-i18n="private"></span></div>
          <form id="server-form" novalidate>
            <label for="server-url" class="field-label" data-i18n="urlLabel"></label>
            <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" required class="url-input" />
            <label for="allow-invalid-certs" class="certificate-option">
              <input id="allow-invalid-certs" type="checkbox" />
              <span><span class="certificate-title" data-i18n="certLabel"></span><span class="certificate-hint" data-i18n="certHint"></span></span>
            </label>
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <button id="connect-button" type="submit" class="connect-button">
              <span id="connect-label" data-i18n="connect"></span>
              <svg id="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              <svg id="loading-icon" class="hidden spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle opacity=".25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" /><path opacity=".9" fill="currentColor" d="M21 12a9 9 0 0 1-9 9v-3a6 6 0 0 0 6-6h3Z" /></svg>
            </button>
          </form>
          <button id="clear-button" class="clear-button hidden" type="button" data-i18n="useAnother"></button>
          <p class="local-storage"><span aria-hidden="true">◆</span> <span data-i18n="localStorage"></span></p>
        </section>
      </div>
    </main>
    <script type="module" src="scripts/setup.js"></script>
  </body>
</html>
