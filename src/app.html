<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Securo</title>
    <style>
      :root {
        --bg-page: #f1f5f9;
        --bg-card: #ffffff;
        --border-card: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-glow: rgba(37, 99, 235, 0.25);
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-page: #090d16;
          --bg-card: #131b2e;
          --border-card: #1e293b;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --primary: #3b82f6;
          --primary-hover: #2563eb;
          --primary-glow: rgba(59, 130, 246, 0.35);
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-family);
        background-color: var(--bg-page);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.5rem;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 28rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
      }
      .brand {
        display: inline-grid;
        width: 2.75rem;
        height: 2.75rem;
        place-items: center;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, var(--primary), #1d4ed8);
        color: #fff;
        font-size: 1.25rem;
        font-weight: 900;
        margin-bottom: 1.25rem;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.5rem; font-weight: 700; }
      p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; }
      .server-badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.85rem;
        padding: 0.4rem 0.75rem;
        background: rgba(37, 99, 235, 0.1);
        border-radius: 0.5rem;
        color: var(--primary);
        margin-bottom: 1.5rem;
        word-break: break-all;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border-card);
        background: var(--bg-card);
        color: var(--text-main);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s;
      }
      .btn:hover { border-color: var(--primary); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">S</div>
      <h1>Securo</h1>
      <p id="desc">Servidor conectado.</p>
      <div id="server-url" class="server-badge">...</div>
      <a href="config/config.html" class="btn" id="config-btn">Configurar Servidor</a>
    </div>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      if (invoke) {
        invoke("get_connection_settings").then((settings) => {
          if (settings.server_url) {
            document.querySelector("#server-url").textContent = settings.server_url;
          } else {
            window.location.replace("config/config.html");
          }
        }).catch(() => {});
      }
    </script>
  </body>
</html>
